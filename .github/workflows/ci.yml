name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  # Build and test on the oldest and newest supported toolchains.
  # Each leg selects an Xcode through DEVELOPER_DIR, so the Swift compiler
  # always matches the SDK it builds against.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift 6.2 (Xcode 26.0)
            runner: macos-26
            xcode: Xcode_26.0.1
            # Compile the iOS tests only: the simulator runtimes on this
            # image (iOS 26.2+) are newer than Xcode 26.0's SDK.
            ios-action: build-for-testing
            ios-destination: generic/platform=iOS Simulator
          - name: Swift 6.4 (Xcode 27.0)
            # GitHub's hosted Xcode 27 preview image, which installs Xcode
            # 27.0 at /Applications/Xcode_27.app. See "Xcode 27" in
            # https://github.com/actions/runner-images. Move this leg to the
            # regular macOS image once that ships Xcode 27, as the preview
            # label may then be retired.
            runner: xcode-27
            xcode: Xcode_27
            ios-action: test
            ios-destination: platform=iOS Simulator,name=iPhone 17,OS=latest
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check the selected Xcode is installed
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Installed: $(ls -d /Applications/Xcode*.app | xargs)"
            exit 1
          fi
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test (macOS)
        run: swift test --skip-build
      - name: Run CLI demo
        run: swift run SwiftExecutorsCLI
      - name: iOS Simulator
        run: |
          xcodebuild ${{ matrix.ios-action }} \
            -scheme SwiftExecutors-Package \
            -destination '${{ matrix.ios-destination }}'

  # Code Quality (macOS only)
  code-quality:
    name: Code Quality
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check SwiftFormat (if config exists)
      run: |
        if [ -f .swiftformat ]; then
          brew install swiftformat
          swiftformat --lint --config .swiftformat Sources/ Tests/
        else
          echo "No SwiftFormat config found, skipping format check"
        fi

  # Package Validation
  package-validation:
    name: Package Validation
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check package description
      run: swift package describe

  # Release job - only runs on tag pushes
  release:
    name: Create Release
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, code-quality, package-validation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## What's Changed

          This release includes:
          - Swift Executors library for task execution
          - Support for iOS 18+ and macOS 15+
          - CLI tool for executor demonstrations
          - Thread, Queue, and DispatchQueue executors

          ## Installation

          ```swift
          .package(url: "https://github.com/Kosikowski/swift-executors.git", from: "${{ github.ref_name }}")
          ```

          ## Usage

          ```swift
          import SwiftExecutors

          let executor = ThreadExecutor()
          // ... use the executor
          ```
        draft: false
        prerelease: false
