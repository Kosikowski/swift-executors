name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Read-only by default. The release job asks for what it needs itself.
permissions:
  contents: read

jobs:
  # Build and test on the oldest and newest supported toolchains.
  # Each leg selects an Xcode through DEVELOPER_DIR, so the Swift compiler
  # always matches the SDK it builds against.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift 6.2 (Xcode 26.0)
            runner: macos-26
            xcode: Xcode_26.0.1
            # xcodebuild on this image accepts no simulator destination for
            # Xcode 26.0, whose runtimes it lacks (the installed ones are
            # 26.2 and later), so the iOS tests only compile on this leg.
            simulator-tests: false
          - name: Swift 6.4 (Xcode 27.0)
            # GitHub's hosted Xcode 27 preview image, which installs Xcode
            # 27.0 at /Applications/Xcode_27.app. See "Xcode 27" in
            # https://github.com/actions/runner-images. Move this leg to the
            # regular macOS image once that ships Xcode 27, as the preview
            # label may then be retired.
            runner: xcode-27
            xcode: Xcode_27
            simulator-tests: true
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check the selected Xcode is installed
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Installed: $(ls -d /Applications/Xcode*.app | xargs)"
            exit 1
          fi
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test (macOS)
        run: swift test --skip-build
      - name: Run CLI demo
        run: swift run SwiftExecutorsCLI
      - name: Test (iOS Simulator)
        if: ${{ matrix.simulator-tests }}
        run: |
          xcodebuild test \
            -scheme SwiftExecutors-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      # The other platforms only need to compile: their runtime behaviour
      # is the same Swift runtime the macOS and iOS legs exercise.
      # SwiftPM compiles against the SDKs inside the selected Xcode and
      # needs no simulator runtime, unlike an xcodebuild destination.
      # --sdk is needed on Swift 6.2, whose SwiftPM otherwise keeps the
      # macOS SDK; Swift 6.4 derives it from the triple.
      - name: Build for the iOS, tvOS, watchOS and visionOS simulators
        run: |
          for platform in ios:iphonesimulator tvos:appletvsimulator watchos:watchsimulator xros:xrsimulator; do
            swift build --build-tests \
              --triple "arm64-apple-${platform%%:*}-simulator" \
              --sdk "$(xcrun --sdk "${platform##*:}" --show-sdk-path)"
          done

  # Formatting, against the .swiftformat config in the repository root.
  code-quality:
    name: Code Quality
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install SwiftFormat
      run: command -v swiftformat || brew install swiftformat

    - name: Check formatting
      run: swiftformat Sources Tests Package.swift --lint --reporter github-actions-log

  # Package Validation
  package-validation:
    name: Package Validation
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check package description
      run: swift package describe

  # Release job - only runs on tag pushes
  release:
    name: Create Release
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, code-quality, package-validation]
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cat > release-notes.md <<EOF
        ## What's Changed

        This release includes:
        - Swift Executors library for task execution
        - Support for iOS 18+, macOS 15+, tvOS 18+, watchOS 11+ and visionOS 2+
        - CLI tool for executor demonstrations
        - Thread, Queue, and DispatchQueue executors

        ## Installation

        \`\`\`swift
        .package(url: "https://github.com/Kosikowski/swift-executors.git", from: "${TAG#v}")
        \`\`\`

        ## Usage

        \`\`\`swift
        import SwiftExecutors

        let executor = ThreadExecutor()
        // ... use the executor
        \`\`\`
        EOF
        gh release create "$TAG" --title "Release $TAG" --notes-file release-notes.md
